<!DOCTYPE html>
<html class="staticrypt-html" lang="ko">

        <meta charset="utf-8" />
        <title>/*[|template_title|]*/0</title>

        <style>
            :root {
                color-scheme: dark;
                --surface-1: #1a1a19;
                --page: #0d0d0d;
                --ink-1: #ffffff;
                --ink-2: #c3c2b7;
                --ink-muted: #898781;
                --grid: #2c2c2a;
                --border: rgba(255, 255, 255, 0.1);
                --brand: #f37321;
                --crit: #d03b3b;
            }
            * { margin: 0; padding: 0; box-sizing: border-box; }
            .staticrypt-html { height: 100%; }
            .staticrypt-body {
                height: 100%;
                font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
                background:
                    radial-gradient(ellipse 90% 55% at 50% -10%, rgba(243, 115, 33, 0.13), transparent 70%),
                    var(--page);
                color: var(--ink-1);
                line-height: 1.55;
                -webkit-font-smoothing: antialiased;
            }
            .staticrypt-content {
                min-height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 24px 16px;
            }
            /* 로그인 카드는 항상 크게 표시 (모바일에서만 원래 크기) */
            .login-card { zoom: 1.45; }
            @media (max-width: 760px) { .login-card { zoom: 1; } }
            .login-card {
                width: min(400px, 100%);
                background: var(--surface-1);
                border: 1px solid var(--border);
                border-top: 3px solid var(--brand);
                border-radius: 14px;
                padding: 34px 32px 28px;
                box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
            }
            .login-card.shake { animation: shake 0.4s ease; }
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                20% { transform: translateX(-9px); }
                40% { transform: translateX(8px); }
                60% { transform: translateX(-6px); }
                80% { transform: translateX(4px); }
            }
            .brandrow {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 6px;
            }
            .hlelogo { width: 30px; height: 30px; object-fit: contain; flex: none; }
            .brandrow h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
            .brandrow h1 .hle { color: var(--brand); }
            .badge {
                display: inline-block;
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.08em;
                padding: 2px 10px;
                border: 1px solid var(--border);
                border-radius: 999px;
                color: var(--ink-2);
                background: rgba(255, 255, 255, 0.03);
                margin-bottom: 18px;
            }
            .badge b { color: var(--brand); font-weight: 700; }
            .instructions {
                font-size: 13px;
                color: var(--ink-muted);
                margin-bottom: 22px;
                padding-bottom: 18px;
                border-bottom: 1px solid var(--grid);
            }
            .field-label {
                display: block;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.09em;
                text-transform: uppercase;
                color: var(--ink-muted);
                margin-bottom: 7px;
            }
            .staticrypt-password-container { position: relative; margin-bottom: 6px; }
            .staticrypt-password-container input[type="password"],
            .staticrypt-password-container input[type="text"] {
                width: 100%;
                background: var(--page);
                border: 1px solid var(--border);
                border-radius: 9px;
                color: var(--ink-1);
                font-size: 15px;
                font-family: inherit;
                letter-spacing: 0.04em;
                padding: 12px 44px 12px 14px;
                outline: 0;
                transition: border-color 0.15s, box-shadow 0.15s;
            }
            .staticrypt-password-container input:focus {
                border-color: var(--brand);
                box-shadow: 0 0 0 3px rgba(243, 115, 33, 0.18);
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                width: 18px;
                height: 18px;
                padding: 12px;
                position: absolute;
                right: 2px;
                top: 50%;
                transform: translateY(-50%);
                opacity: 0.45;
                filter: invert(85%) sepia(6%) saturate(120%);
                transition: opacity 0.15s;
            }
            .staticrypt-toggle-password-visibility:hover { opacity: 0.9; }
            .error-msg {
                min-height: 20px;
                font-size: 12.5px;
                color: var(--crit);
                margin-bottom: 8px;
                visibility: hidden;
            }
            .error-msg.show { visibility: visible; }
            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 9px;
                font-size: 13px;
                color: var(--ink-2);
                margin-bottom: 18px;
                cursor: pointer;
                user-select: none;
            }
            .staticrypt-remember input[type="checkbox"] {
                width: 16px;
                height: 16px;
                accent-color: var(--brand);
                cursor: pointer;
            }
            .staticrypt-decrypt-button {
                width: 100%;
                background: var(--brand);
                border: 0;
                border-radius: 10px;
                color: #fff;
                font-family: inherit;
                font-size: 15px;
                font-weight: 700;
                letter-spacing: 0.02em;
                padding: 13px;
                cursor: pointer;
                transition: filter 0.15s, transform 0.05s;
            }
            .staticrypt-decrypt-button:hover { filter: brightness(1.09); }
            .staticrypt-decrypt-button:active { transform: translateY(1px); }
            .foot {
                margin-top: 26px;
                font-size: 11px;
                letter-spacing: 0.12em;
                color: var(--ink-muted);
                text-transform: uppercase;
                text-align: center;
            }
            .foot .dot { color: var(--brand); }
            .hidden { display: none !important; }
            .staticrypt-spinner-container {
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 2.2rem;
                height: 2.2rem;
                border: 0.25em solid var(--grid);
                border-top-color: var(--brand);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }
        </style>
    </head>

        <script>
            // these variables will be filled when generating the file - the template format is '/*[|variable_name|]*/0'
            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const templateError = "/*[|template_error|]*/0",
                templateToggleAltShow = "/*[|template_toggle_show|]*/0",
                templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
                isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            // init the staticrypt engine
            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // try to automatically decrypt on load if there is a saved password
            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been
                // replaced, no need to do anything
                if (!isSuccessful) {
                    // hide loading screen
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();

                    if (isRememberEnabled) {
                        document.getElementById("staticrypt-remember-label").classList.remove("hidden");

            const imgSrcEyeOpened =
                "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1NzYgNTEyIj48IS0tIUZvbnQgQXdlc29tZSBGcmVlIDYuNS4yIGJ5IEBmb250YXdlc29tZSAtIGh0dHBzOi8vZm9udGF3ZXNvbWUuY29tIExpY2Vuc2UgLSBodHRwczovL2ZvbnRhd2Vzb21lLmNvbS9saWNlbnNlL2ZyZWUgQ29weXJpZ2h0IDIwMjQgRm9udGljb25zLCBJbmMuLS0+PHBhdGggZD0iTTI4OCAzMmMtODAuOCAwLTE0NS41IDM2LjgtMTkyLjYgODAuNkM0OC42IDE1NiAxNy4zIDIwOCAyLjUgMjQzLjdjLTMuMyA3LjktMy4zIDE2LjcgMCAyNC42QzE3LjMgMzA0IDQ4LjYgMzU2IDk1LjQgMzk5LjRDMTQyLjUgNDQzLjIgMjA3LjIgNDgwIDI4OCA0ODBzMTQ1LjUtMzYuOCAxOTIuNi04MC42YzQ2LjgtNDMuNSA3OC4xLTk1LjQgOTMtMTMxLjFjMy4zLTcuOSAzLjMtMTYuNyAwLTI0LjZjLTE0LjktMzUuNy00Ni4yLTg3LjctOTMtMTMxLjFDNDMzLjUgNjguOCAzNjguOCAzMiAyODggMzJ6TTE0NCAyNTZhMTQ0IDE0NCAwIDEgMSAyODggMCAxNDQgMTQ0IDAgMSAxIC0yODggMHptMTQ0LTY0YzAgMzUuMy0yOC43IDY0LTY0IDY0Yy03LjEgMC0xMy45LTEuMi0yMC4zLTMuM2MtNS41LTEuOC0xMS45IDEuNi0xMS43IDcuNGMuMyA2LjkgMS4zIDEzLjggMy4yIDIwLjdjMTMuNyA1MS4yIDY2LjQgODEuNiAxMTcuNiA2Ny45czgxLjYtNjYuNCA2Ny45LTExNy42Yy0xMS4xLTQxLjUtNDcuOC02OS40LTg4LjYtNzEuMWMtNS44LS4yLTkuMiA2LjEtNy40IDExLjdjMi4xIDYuNCAzLjMgMTMuMiAzLjMgMjAuM3oiLz48L3N2Zz4=";

                const passwordInput = document.getElementById("staticrypt-password");
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // handle password form submission — show inline error + shake instead of alert()
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    const card = document.getElementById("login-card");
                    document.getElementById("error-msg").classList.add("show");
                    card.classList.remove("shake");
                    void card.offsetWidth; // restart animation
                    card.classList.add("shake");
                    const input = document.getElementById("staticrypt-password");
                    input.select();
                    input.focus();
                }
            });
