<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <title>HLE 통합 분석 허브</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow, noarchive" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root {
                color-scheme: dark;
                --surface-1: #1a1a19;
                --page: #0d0d0d;
                --ink-1: #ffffff;
                --ink-2: #c3c2b7;
                --ink-muted: #898781;
                --grid: #2c2c2a;
                --border: rgba(255, 255, 255, 0.1);
                --brand: #f37321;
                --crit: #d03b3b;
            }
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html { height: 100%; }
            body {
                height: 100%;
                font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
                background:
                    radial-gradient(ellipse 90% 55% at 50% -10%, rgba(243, 115, 33, 0.13), transparent 70%),
                    var(--page);
                color: var(--ink-1);
                line-height: 1.55;
                -webkit-font-smoothing: antialiased;
            }
            .content {
                min-height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 24px 16px;
            }
            /* 로그인 카드는 항상 크게 표시 (모바일에서만 원래 크기) */
            .login-card { zoom: 1.45; }
            @media (max-width: 760px) { .login-card { zoom: 1; } }
            .login-card {
                width: min(400px, 100%);
                background: var(--surface-1);
                border: 1px solid var(--border);
                border-top: 3px solid var(--brand);
                border-radius: 14px;
                padding: 34px 32px 28px;
                box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
            }
            .login-card.shake { animation: shake 0.4s ease; }
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                20% { transform: translateX(-9px); }
                40% { transform: translateX(8px); }
                60% { transform: translateX(-6px); }
                80% { transform: translateX(4px); }
            }
            .brandrow { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
            .hlelogo { width: 30px; height: 30px; object-fit: contain; flex: none; }
            .brandrow h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
            .brandrow h1 .hle { color: var(--brand); }
            .badge {
                display: inline-block;
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.08em;
                padding: 2px 10px;
                border: 1px solid var(--border);
                border-radius: 999px;
                color: var(--ink-2);
                background: rgba(255, 255, 255, 0.03);
                margin-bottom: 18px;
            }
            .badge b { color: var(--brand); font-weight: 700; }
            .instructions {
                font-size: 13px;
                color: var(--ink-muted);
                margin-bottom: 22px;
                padding-bottom: 18px;
                border-bottom: 1px solid var(--grid);
            }
            .field-label {
                display: block;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.09em;
                text-transform: uppercase;
                color: var(--ink-muted);
                margin-bottom: 7px;
            }
            .password-container { position: relative; margin-bottom: 6px; }
            .password-container input[type="password"],
            .password-container input[type="text"] {
                width: 100%;
                background: var(--page);
                border: 1px solid var(--border);
                border-radius: 9px;
                color: var(--ink-1);
                font-size: 15px;
                font-family: inherit;
                letter-spacing: 0.04em;
                padding: 12px 44px 12px 14px;
                outline: 0;
                transition: border-color 0.15s, box-shadow 0.15s;
            }
            .password-container input:focus {
                border-color: var(--brand);
                box-shadow: 0 0 0 3px rgba(243, 115, 33, 0.18);
            }
            .toggle-password {
                cursor: pointer;
                width: 18px;
                height: 18px;
                padding: 12px;
                position: absolute;
                right: 2px;
                top: 50%;
                transform: translateY(-50%);
                opacity: 0.45;
                filter: invert(85%) sepia(6%) saturate(120%);
                transition: opacity 0.15s;
            }
            .toggle-password:hover { opacity: 0.9; }
            .error-msg {
                min-height: 20px;
                font-size: 12.5px;
                color: var(--crit);
                margin-bottom: 8px;
                visibility: hidden;
            }
            .error-msg.show { visibility: visible; }
            label.remember {
                display: flex;
                align-items: center;
                gap: 9px;
                font-size: 13px;
                color: var(--ink-2);
                margin-bottom: 18px;
                cursor: pointer;
                user-select: none;
            }
            .remember input[type="checkbox"] {
                width: 16px;
                height: 16px;
                accent-color: var(--brand);
                cursor: pointer;
            }
            .decrypt-button {
                width: 100%;
                background: var(--brand);
                border: 0;
                border-radius: 10px;
                color: #fff;
                font-family: inherit;
                font-size: 15px;
                font-weight: 700;
                letter-spacing: 0.02em;
                padding: 13px;
                cursor: pointer;
                transition: filter 0.15s, transform 0.05s;
            }
            .decrypt-button:hover { filter: brightness(1.09); }
            .decrypt-button:active { transform: translateY(1px); }
            .decrypt-button:disabled { filter: grayscale(0.4) brightness(0.8); cursor: wait; }
            .foot {
                margin-top: 26px;
                font-size: 11px;
                letter-spacing: 0.12em;
                color: var(--ink-muted);
                text-transform: uppercase;
                text-align: center;
            }
            .foot .dot { color: var(--brand); }
            .hidden { display: none !important; }
            .spinner-container {
                height: 100vh;
                display: flex;
                flex-direction: column;
                gap: 18px;
                align-items: center;
                justify-content: center;
            }
            .spinner {
                display: inline-block;
                width: 2.2rem;
                height: 2.2rem;
                border: 0.25em solid var(--grid);
                border-top-color: var(--brand);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            .spinner-label { font-size: 12.5px; color: var(--ink-muted); letter-spacing: 0.06em; }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
            /* 131차 — 입장 오프닝: 보일 때 모이고(.in) · 머무는 동안 은은히 움직이고 · 위아래로 갈라져 열린다(.out). 로그인 화면 이어받기 = .pre */
            /* 132차 — 반쪽 단색 · 주황 기운은 #hubIntro::after · 경계 주황 줄 삭제 (셸 hle-intro125와 같은 값) */
            #hubIntro{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;cursor:pointer;overflow:hidden}
            #hubIntro .pt,#hubIntro .pb{position:absolute;left:0;right:0;height:50.5%;background:#0d0d0d;
              transition:transform .9s cubic-bezier(.65,0,.25,1) .16s}
            #hubIntro .pt{top:0;background-position:center top}#hubIntro .pb{bottom:0;background-position:center bottom}
            #hubIntro .bg{position:absolute;z-index:1;left:50%;top:46%;width:72vmax;height:72vmax;margin:-36vmax 0 0 -36vmax;border-radius:50%;pointer-events:none;opacity:0;
              background:radial-gradient(circle,rgba(243,115,33,.16) 0%,rgba(243,115,33,.05) 38%,transparent 66%)}
            #hubIntro::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,#26160b 0%,#120d0a 38%,rgba(13,13,13,0) 70%)}
            #hubIntro .core{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
            #hubIntro .lg{position:relative;width:84px;height:84px}
            #hubIntro .lg::before{content:"";position:absolute;left:50%;top:50%;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;opacity:0;
              background:radial-gradient(circle,rgba(243,115,33,.34) 0%,rgba(243,115,33,.10) 42%,transparent 70%)}
            #hubIntro img{position:relative;width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 0 22px rgba(243,115,33,.45))}
            #hubIntro .tt{font-size:26px;font-weight:800;letter-spacing:.02em;color:#fff}
            #hubIntro .tt span{color:#f37321}
            #hubIntro .ln{position:relative;width:220px;height:3px;border-radius:2px;overflow:hidden;background:linear-gradient(90deg,transparent,#f37321 20%,#f37321 80%,transparent);transform-origin:center}
            #hubIntro .ln::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;transform:translateX(-120%);background:linear-gradient(90deg,transparent,rgba(255,236,214,.95),transparent)}
            #hubIntro .sb{font-size:12px;letter-spacing:.32em;color:#9a978f;text-transform:uppercase}
            #hubIntro .lg,#hubIntro .tt,#hubIntro .ln,#hubIntro .sb{opacity:0}
            #hubIntro.in .lg{animation:hiLogo 1.15s cubic-bezier(.16,.84,.24,1) both}
            #hubIntro.in .tt{animation:hiText 1s .35s cubic-bezier(.16,.84,.24,1) both}
            #hubIntro.in .ln{animation:hiLine .95s .65s cubic-bezier(.6,0,.2,1) both}
            #hubIntro.in .sb{animation:hiSub .85s .95s ease both}
            #hubIntro.in .bg{animation:hiFade 1.2s ease both,hiDrift 7s 1.2s ease-in-out infinite alternate}
            #hubIntro.in .lg::before{animation:hiFade .9s .7s ease both,hiPulse 2.8s 1.6s ease-in-out infinite}
            #hubIntro.in .ln::after{animation:hiSheen 2.6s 1.7s ease-in-out infinite}
            #hubIntro.pre .lg,#hubIntro.pre .tt,#hubIntro.pre .ln,#hubIntro.pre .sb,#hubIntro.pre .bg,#hubIntro.pre .lg::before{opacity:1;animation:none}
            #hubIntro.pre.in .bg{animation:hiDrift 7s ease-in-out infinite alternate}
            #hubIntro.pre.in .lg::before{animation:hiPulse 2.8s ease-in-out infinite}
            #hubIntro.pre.in .ln::after{animation:hiSheen 2.6s .2s ease-in-out infinite}
            #hubIntro.out{pointer-events:none}
            #hubIntro.out .pt{transform:translateY(-101%)}#hubIntro.out .pb{transform:translateY(101%)}
            #hubIntro.out .ln{opacity:1;animation:hiLineOut .55s cubic-bezier(.5,0,.2,1) forwards}
            #hubIntro.out .lg{opacity:1;animation:hiLogoOut .55s cubic-bezier(.5,0,.2,1) forwards}
            #hubIntro.out .tt,#hubIntro.out .sb{opacity:1;animation:hiTextOut .45s ease forwards}
            #hubIntro.out::after{animation:hiFadeOut .25s ease forwards}
            #hubIntro.out .bg,#hubIntro.out .lg::before{animation:hiFadeOut .25s ease forwards}
            @keyframes hiLogo{0%{opacity:0;transform:scale(.62) rotate(-10deg);filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
            @keyframes hiText{from{opacity:0;transform:translateY(12px);letter-spacing:.34em}to{opacity:1;transform:none;letter-spacing:.02em}}
            @keyframes hiSub{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
            @keyframes hiLine{from{transform:scaleX(0);opacity:.2}to{transform:scaleX(1);opacity:1}}
            @keyframes hiSheen{0%{transform:translateX(-120%)}60%,100%{transform:translateX(330%)}}
            @keyframes hiPulse{0%,100%{transform:scale(.92)}50%{transform:scale(1.14)}}
            @keyframes hiDrift{from{transform:translate(-2.5%,-1.5%) scale(1)}to{transform:translate(2.5%,2%) scale(1.08)}}
            @keyframes hiLineOut{from{transform:scaleX(1);opacity:1}55%{opacity:1}to{transform:scaleX(9);opacity:0}}
            @keyframes hiLogoOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(1.22)}}
            @keyframes hiTextOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-8px)}}
            @keyframes hiFadeOut{to{opacity:0}}
            @keyframes hiFade{from{opacity:0}to{opacity:1}}
            #hubIntro.hidden{display:none}
            @media (prefers-reduced-motion:reduce){#hubIntro .lg,#hubIntro .tt,#hubIntro .ln,#hubIntro .sb{opacity:1!important;animation:none!important}}
        </style>
    </head>

        <script>
            "use strict";
            /* ── HLE Hub 암호화 로더 ──
               페이로드: 별도 파일(payload.bin) — gzip 압축 후 AES-256-GCM 암호화.
               로그인 화면은 즉시 뜨고, 페이로드는 백그라운드로 미리 다운로드.
               키 유도: PBKDF2-SHA256 (반복수 아래 ITER).
               기억하기: 유도된 키(비밀번호 아님)를 localStorage에 저장. */
            const SALT_B64 = "I6VXmBI+icvnDwHICLVTVQ==";
            const ITER = 600000;
            const REMEMBER_DAYS = 30;
            const LS_KEY = "hlehub_k", LS_EXP = "hlehub_exp";
            // 언어 선택 (허브 안의 EN/KO 버튼이 hlehub_lang을 기록)
            const PAYLOAD_KO = "payload.bin?v=46b37c9300", PAYLOAD_EN = "payload_en.bin?v=47dbf52e3f";
            // 내장문서 조각 목록 — payload.bin 은 이제 셸(0.5MB)만 담고 문서는 따로 받는다
            const PARTS_KO = {"scout":"p/ko-scout-a2f4b67d2c.bin","db":"p/ko-db-7ab11b756c.bin","planner":"p/ko-planner-757e287278.bin","lab":"p/ko-lab-8976e4904c.bin","wscout":"p/ko-wscout-dc7e408157.bin","wz":"p/ko-wz-e9ecf74513.bin","old":"p/ko-old-b3941a637e.bin"}, PARTS_EN = {"scout":"p/en-scout-983be254e9.bin","db":"p/en-db-605bafd6c9.bin","planner":"p/en-planner-a783423edf.bin","lab":"p/en-lab-1964ce3574.bin","wscout":"p/en-wscout-f2a2b4401c.bin","wz":"p/en-wz-4866b73ffe.bin","old":"p/en-old-e642997722.bin"};
            let LANG = "ko";
            try { if (PAYLOAD_EN && localStorage.getItem("hlehub_lang") === "en") LANG = "en"; } catch (e) {}
            const PAYLOAD_URL = LANG === "en" ? PAYLOAD_EN : PAYLOAD_KO;
            const PARTS = (LANG === "en" ? PARTS_EN : PARTS_KO) || {};
            // 첫 화면에 필요한 문서 하나만 셸과 함께 받는다.
            // 셸이 시작 문서를 고정하면(빌드 때 감지) 그 문서를, 아니면 지난번에 보던 탭을 받는다.
            const FIXED_START = (LANG === "en" ? null : "scout");
            let START_DOC = (FIXED_START && PARTS[FIXED_START]) ? FIXED_START : null;
            if (!START_DOC) { try { const v = localStorage.getItem("hle-hub-tab"); if (v && PARTS[v]) START_DOC = v; } catch (e) {} }
            if (!START_DOC) START_DOC = PARTS.scout ? "scout" : (Object.keys(PARTS)[0] || null);

            const $ = (id) => document.getElementById(id);
            const b64ToBuf = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

            // ── 페이로드 백그라운드 다운로드 (페이지 열리자마자 시작) ──
            let dlProgress = 0; // 0~100
            const payloadPromise = (async () => {
                const res = await fetch(PAYLOAD_URL);
                if (!res.ok) throw new Error("payload fetch failed: " + res.status);
                // content-length는 전송(압축) 크기라 실제 바이트 수와 다를 수 있음 — 진행률 추정에만 사용
                const total = Number(res.headers.get("content-length") || 0);
                if (!res.body) { dlProgress = 100; return new Uint8Array(await res.arrayBuffer()); }
                const reader = res.body.getReader();
                const chunks = [];
                let got = 0;
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    got += value.length;
                    if (total) dlProgress = Math.min(99, Math.round((got / total) * 100));
                }
                const buf = new Uint8Array(got);
                let off = 0;
                for (const c of chunks) { buf.set(c, off); off += c.length; }
                dlProgress = 100;
                return buf;
            })();

            // 시작 문서 조각도 로그인 화면이 뜨는 즉시 함께 받아 둔다
            const startPartPromise = START_DOC
                ? fetch(PARTS[START_DOC])
                      .then((r) => { if (!r.ok) throw new Error("part fetch failed: " + r.status); return r.arrayBuffer(); })
                      .then((b) => new Uint8Array(b))
                : Promise.resolve(null);
            startPartPromise.catch(() => {}); // 실패해도 허브는 열린다 (안에서 다시 받는다)

            async function deriveKey(password) {
                const mat = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
                return crypto.subtle.deriveKey(
                    { name: "PBKDF2", salt: b64ToBuf(SALT_B64), iterations: ITER, hash: "SHA-256" },
                    mat, { name: "AES-GCM", length: 256 }, true, ["decrypt"]
                );
            }

            /* ── 점진 렌더링용 양보 ──
               setTimeout 은 비활성(백그라운드) 탭에서 최소 1초로 클램프된다.
               25MB를 256KB씩 78조각으로 쓰면 조각당 1초 × 78 = 80초가 대기로만 날아간다
               (실측: 파싱 0.16초 / 대기 28.9초).
               MessageChannel 은 타이머가 아니라 태스크 큐라 클램프를 받지 않으면서도
               태스크 경계를 만들어 주므로 헤더 선(先) 렌더는 그대로 유지된다.
               포트가 죽는 환경을 대비해 setTimeout 안전장치를 함께 건다. */
            const yieldToBrowser = (() => {
                try {
                    const ch = new MessageChannel();
                    return () => new Promise((resolve) => {
                        let done = false;
                        const fin = () => { if (!done) { done = true; resolve(); } };
                        ch.port1.onmessage = fin;
                        ch.port2.postMessage(0);
                        setTimeout(fin, 1000); // 안전장치 — 메시지가 오지 않아도 진행
                    });
                } catch (e) {
                    return () => new Promise((r) => setTimeout(r, 0));
                }
            })();

            /* 첫 조각은 작게(헤더가 먼저 그려지도록), 이후는 크게(양보 횟수를 줄이도록) */
            async function writeChunked(html) {
                const FIRST = 131072;    // 128KB
                const REST = 2097152;    // 2MB
                let i = 0, size = FIRST;
                while (i < html.length) {
                    document.write(html.slice(i, i + size));
                    i += size;
                    size = REST;
                    if (i < html.length) await yieldToBrowser();
                }
            }

            async function decryptAndShow(key, onWait) {
                // 다운로드가 아직이면 진행률을 보여주며 대기
                if (dlProgress < 100 && onWait) {
                    const timer = setInterval(() => onWait(dlProgress), 150);
                    try { await payloadPromise; } finally { clearInterval(timer); }
                }
                const buf = await payloadPromise;
                // payload 앞 12바이트가 IV (배포 버전 어긋나도 항상 복호화 가능)
                const iv = buf.slice(0, 12), cipher = buf.slice(12);
                const plainGz = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipher);
                showIntro();   // 130차: 비밀번호가 맞은 게 확인된 뒤에만 오프닝을 켠다
                // 복호화 성공 → 언어 전환 버튼이 재로그인 없이 쓸 수 있게 세션에 키 보관
                try {
                    const raw = await crypto.subtle.exportKey("raw", key);
                    sessionStorage.setItem("hlehub_sk", btoa(String.fromCharCode(...new Uint8Array(raw))));
                } catch (e) {}
                // gzip 해제
                const ds = new DecompressionStream("gzip");
                const stream = new Blob([plainGz]).stream().pipeThrough(ds);
                const html = await new Response(stream).text();
                // 셸에는 문서 본문이 비어 있다 — 시작 문서만 여기서 채우고,
                // 나머지는 허브 안 지연 로더가 탭을 누를 때 받는다.
                const full = await spliceStartDoc(html, key);
                // 130차: 셸 오프닝이 「다 모인 모습」으로 이어받도록 오프닝이 처음 보인 시각을 넘긴다
                try { if (introT0) sessionStorage.setItem("hle-intro-t0", String(introT0)); } catch (e) {}
                document.open();
                await writeChunked(full);
                document.close();
            }

            async function spliceStartDoc(shellHtml, key) {
                if (!START_DOC) return shellHtml;
                try {
                    const buf = await startPartPromise;
                    if (!buf) return shellHtml;
                    const plainGz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
                    const ds = new DecompressionStream("gzip");
                    const body = await new Response(new Blob([plainGz]).stream().pipeThrough(ds)).text();
                    const tag = "<scr" + "ipt type=\"text/x-doc\" id=\"src-" + START_DOC + "\">";
                    const at = shellHtml.indexOf(tag);
                    if (at === -1) return shellHtml;
                    const cut = at + tag.length;
                    return shellHtml.slice(0, cut) + body + shellHtml.slice(cut);
                } catch (e) {
                    return shellHtml; // 조각을 못 받아도 셸은 연다
                }
            }

            /* 130차 — 「허브 여는 중… N%」 대신 오프닝으로 로딩 시간을 덮는다 */
            let introT0 = 0;
            // 셸이 이어받기 신호(hle-intro-t0)를 읽는 언어에서만 오프닝을 쓴다(빌드 때 감지).
            // 동결 영어판처럼 예전 셸이면 예전처럼 스피너 + 진행률을 보여 준다.
            const INTRO_OK = (LANG === "en" ? false : true);
            function showIntro() {
                if (!INTRO_OK) { $("loading-label").textContent = "허브 여는 중…"; return; }
                if (introT0) return;
                introT0 = Date.now();
                const o = $("hubIntro");
                o.classList.remove("hidden");
                requestAnimationFrame(() => requestAnimationFrame(() => o.classList.add("in")));   // 보일 때 모이기 시작
                $("loading").classList.add("hidden");   // 스피너 · 진행률 글자를 가린다
            }
            function hideIntro() { introT0 = 0; const o = $("hubIntro"); o.classList.add("hidden"); o.classList.remove("in"); }

            function showLogin() {
                $("loading").classList.add("hidden");
                $("content").classList.remove("hidden");
                $("password").focus();
            }

            function showError() {
                const card = $("login-card");
                $("error-msg").classList.add("show");
                card.classList.remove("shake");
                void card.offsetWidth;
                card.classList.add("shake");
                const input = $("password");
                input.select();
                input.focus();
            }

            async function rememberKey(key) {
                try {
                    const raw = await crypto.subtle.exportKey("raw", key);
                    localStorage.setItem(LS_KEY, btoa(String.fromCharCode(...new Uint8Array(raw))));
                    localStorage.setItem(LS_EXP, String(Date.now() + REMEMBER_DAYS * 864e5));
                } catch (e) {}
            }

            /* 저장된 키 찾기
               ① 이 탭의 세션 키 — 언어 전환은 새로고침으로 처리하므로 이게 있으면 재로그인이 없다
               ② 「기억하기」로 localStorage 에 저장된 키 */
            function savedKeyB64() {
                try { const sk = sessionStorage.getItem("hlehub_sk"); if (sk) return { b64: sk, session: true }; } catch (e) {}
                try {
                    const b64 = localStorage.getItem(LS_KEY), exp = Number(localStorage.getItem(LS_EXP) || 0);
                    if (b64 && Date.now() <= exp) return { b64, session: false };
                } catch (e) {}
                return null;
            }

            async function tryStoredKey() {
                const saved = savedKeyB64();
                if (!saved) return false;
                try {
                    const key = await crypto.subtle.importKey("raw", b64ToBuf(saved.b64), { name: "AES-GCM" }, true, ["decrypt"]);
                    // 130차: 오프닝이 덮으므로 진행률 글자를 쓰지 않는다(예전 셸이면 예전처럼 표시)
                    await decryptAndShow(key, (p) => { if (!INTRO_OK) $("loading-label").textContent = "허브 여는 중… " + p + "%"; });
                    return true;
                } catch (e) {
                    if (saved.session) { try { sessionStorage.removeItem("hlehub_sk"); } catch (_) {} }
                    else { try { localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_EXP); } catch (_) {} }
                    return false;
                }
            }

            // 초기화: 저장된 키가 있으면 자동 접속, 아니면 로그인 폼 즉시 표시
            (async function init() {
                if (!window.crypto || !window.crypto.subtle || typeof DecompressionStream === "undefined") {
                    $("loading-label").textContent = "브라우저가 오래되어 열 수 없습니다. 최신 크롬/엣지로 접속해주세요.";
                    return;
                }
                const hasStored = !!savedKeyB64();
                if (hasStored) {
                    showIntro();   // 130차: 저장된 키로 자동 접속 — 바로 오프닝
                    const ok = await tryStoredKey();
                    if (!ok) { hideIntro(); showLogin(); }
                } else {
                    showLogin(); // 다운로드를 기다리지 않고 즉시 표시
                }
            })();

            // 비밀번호 표시 토글
            const toggleIcon = $("toggle-password");
            const imgSrcEyeClosed = toggleIcon.src;
            const imgSrcEyeOpened =
                "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1NzYgNTEyIj48IS0tIUZvbnQgQXdlc29tZSBGcmVlIDYuNS4yIGJ5IEBmb250YXdlc29tZSAtIGh0dHBzOi8vZm9udGF3ZXNvbWUuY29tIExpY2Vuc2UgLSBodHRwczovL2ZvbnRhd2Vzb21lLmNvbS9saWNlbnNlL2ZyZWUgQ29weXJpZ2h0IDIwMjQgRm9udGljb25zLCBJbmMuLS0+PHBhdGggZD0iTTI4OCAzMmMtODAuOCAwLTE0NS41IDM2LjgtMTkyLjYgODAuNkM0OC42IDE1NiAxNy4zIDIwOCAyLjUgMjQzLjdjLTMuMyA3LjktMy4zIDE2LjcgMCAyNC42QzE3LjMgMzA0IDQ4LjYgMzU2IDk1LjQgMzk5LjRDMTQyLjUgNDQzLjIgMjA3LjIgNDgwIDI4OCA0ODBzMTQ1LjUtMzYuOCAxOTIuNi04MC42YzQ2LjgtNDMuNSA3OC4xLTk1LjQgOTMtMTMxLjFjMy4zLTcuOSAzLjMtMTYuNyAwLTI0LjZjLTE0LjktMzUuNy00Ni4yLTg3LjctOTMtMTMxLjFDNDMzLjUgNjguOCAzNjguOCAzMiAyODggMzJ6TTE0NCAyNTZhMTQ0IDE0NCAwIDEgMSAyODggMCAxNDQgMTQ0IDAgMSAxIC0yODggMHptMTQ0LTY0YzAgMzUuMy0yOC43IDY0LTY0IDY0Yy03LjEgMC0xMy45LTEuMi0yMC4zLTMuM2MtNS41LTEuOC0xMS45IDEuNi0xMS43IDcuNGMuMyA2LjkgMS4zIDEzLjggMy4yIDIwLjdjMTMuNyA1MS4yIDY2LjQgODEuNiAxMTcuNiA2Ny45czgxLjYtNjYuNCA2Ny45LTExNy42Yy0xMS4xLTQxLjUtNDcuOC02OS40LTg4LjYtNzEuMWMtNS44LS4yLTkuMiA2LjEtNy40IDExLjdjMi4xIDYuNCAzLjMgMTMuMiAzLjMgMjAuM3oiLz48L3N2Zz4=";
            toggleIcon.addEventListener("click", function () {
                const input = $("password");
                if (input.type === "password") {
                    input.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                } else {
                    input.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                }
            });

            // 로그인 제출
            $("login-form").addEventListener("submit", async function (e) {
                e.preventDefault();
                const btn = $("submit-btn");
                btn.disabled = true;
                btn.textContent = "확인 중…";
                try {
                    const key = await deriveKey($("password").value);
                    // 비밀번호 검증을 다운로드 완료 전에 하기 위해 GCM 복호화 시도 순서 유지
                    if ($("remember").checked) await rememberKey(key);
                    await decryptAndShow(key, (p) => { btn.textContent = "불러오는 중… " + p + "%"; });
                } catch (err) {
                    try { localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_EXP); } catch (_) {}
                    btn.disabled = false;
                    btn.textContent = "접속하기";
                    showError();
                }
            });
        </script>
    </body>
