name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      # 11/24: 올린 직후 deploy 가 「No artifacts named github-pages」로 자주 실패 → 잠깐 기다리고, 실패하면 한 번 더
      - run: sleep 20
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
