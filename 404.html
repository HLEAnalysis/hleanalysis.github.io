<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>HLE 통합 분석 허브</title>
</head>
<body style="background:#0d0d0d;color:#898781;font-family:system-ui,sans-serif;display:grid;place-items:center;height:100vh;margin:0">
<div>이동 중…</div>
<script>
// 없는 주소로 들어오면 메인으로 안내. 주소에 en이 들어 있으면 영어 모드로.
try {
    if (/(^|[\/_.-])en([\/_.-]|$)/i.test(location.pathname)) localStorage.setItem("hlehub_lang", "en");
} catch (e) {}
location.replace("/");
</script>
</body>
</html>
